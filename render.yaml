services:
  - type: web
    name: shop
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
